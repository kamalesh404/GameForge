[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameforge"
version = "0.1.0"
description = "A modular 2D game engine written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GameForge Team", email = "team@gameforge.dev" }]
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
scripting = ["lupa>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "black>=24.4",
    "flake8>=7.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running integration tests",
    "network: tests that bind sockets",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.isort]
profile = "black"
line_length = 100
